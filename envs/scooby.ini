; =============================================================================
; envs/scooby.ini — Scooby Deck v3 PlatformIO environment (LilyGO T-Deck Plus)
;
; scripts/link_env.sh symlinks this file to external/MeshCore/platformio.local.ini.
; Upstream MeshCore's platformio.ini loads platformio.local.ini via extra_configs and
; git-ignores it, so we extend upstream sections with ZERO MeshCore changes
; (the same attachment Faro uses, ADR-002 in radeksixi/sixi-tdeck-plus).
;
; Build:   scripts/link_env.sh && pio run -d external/MeshCore -e scooby_tdeck -t mergebin
; Paths:   -I / lib paths are relative to external/MeshCore (the PlatformIO project);
;          build_src_filter paths are relative to external/MeshCore/src.
; =============================================================================

[env:scooby_tdeck]
extends = LilyGo_TDeck
build_unflags =
  -std=gnu++11
  ; no key import/export over the (absent) companion link; key backup is an on-device SD action
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; the SX1262 shares SCLK/MISO/MOSI with the TFT and the SD card: without P_LORA_SCLK the radio uses
  ; the global FSPI `SPI` (begun on those pins by the display), so all three sit on one SPIClass and
  ; its bus lock (Faro's fix: two SPI peripherals on one set of GPIOs left the radio deaf)
  -D P_LORA_SCLK=40
  ; upstream's 2.5x/3.75x OLED-emulation ST7789 driver is replaced by our LVGL display
  -D DISPLAY_CLASS=ST7789LCDDisplay
  ; the upstream variant dir is replaced by app/variant (same files + DualMeshRadioWrapper)
  -I variants/lilygo_tdeck
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags =
  ${LilyGo_TDeck.build_flags}
  -std=gnu++17
  -ffile-prefix-map=${sysenv.HOME}=/build
  -fmacro-prefix-map=${sysenv.HOME}=/build
  ; app/variant must win over upstream's variants/lilygo_tdeck for target.h
  -I ../../app/variant
  -I src
  -I ../../app
  -I ../../app/ui
  -I ../../app/hal
  -I ../../app/dualmesh
  ; upstream companion headers (AbstractUITask.h, MyMesh.h, NodePrefs.h, DataStore.h)
  -I examples/companion_radio
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I ../../app/config
  -D DISPLAY_CLASS=FaroDisplay
  -D WRAPPER_CLASS=DualMeshRadioWrapper
  -D SCOOBY_DECK=1
  -D SCOOBY_V3=1
  -D ENV_SKIP_GPS_DETECT=1
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
  ; first-boot MeshCore radio = US/Canada recommended preset (910.525 / 62.5 / SF7 / CR5)
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
  -D ARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck/TDeckBoard.cpp>
  +<helpers/sensors/*.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  ; no upstream ui-new: app/ui/UITask.cpp replaces it
  +<../../../app/>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ 1.4.0
  lvgl/lvgl @ 9.3.0
